<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - Eduardo Lannes Marinato</title>
    <meta name="description" content="Página não encontrada. Volte para o portfólio de Eduardo Lannes Marinato.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#050505">
    <script>
        (function () {
            document.documentElement.classList.add('js');
            var stored = null;
            try { stored = localStorage.getItem('theme'); } catch (e) { }
            var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            var theme = stored ? stored : (prefersLight ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', theme);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', theme === 'light' ? '#f7f7f8' : '#050505');
        })();
    </script>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Estilo Principal -->
    <link rel="stylesheet" href="style.css">
    <style>
        .error-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 5%;
        }

        .error-card {
            max-width: 560px;
        }

        .error-code {
            font-family: var(--font-heading);
            font-size: clamp(5rem, 20vw, 10rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .error-title {
            font-family: var(--font-heading);
            font-size: clamp(1.5rem, 4vw, 2.25rem);
            font-weight: 700;
            margin: 1.5rem 0 0.75rem;
        }

        .error-card p {
            margin-bottom: 2rem;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-home {
            position: fixed;
            top: 1.5rem;
            right: 2rem;
            z-index: 10;
        }
    </style>
</head>

<body>
    <button class="icon-button theme-toggle error-home" type="button" aria-label="Alternar tema claro e escuro"
        aria-pressed="true">
        <i class="fa-solid fa-sun"></i>
    </button>

    <main class="error-shell">
        <div class="error-card">
            <div class="error-code" aria-hidden="true">404</div>
            <h1 class="error-title">Página não encontrada</h1>
            <p>Opa! O link que você tentou acessar não existe ou foi movido.</p>
            <div class="error-actions">
                <a href="index.html" class="primary-action">Voltar ao início</a>
                <a href="index.html#work" class="secondary-action">Ver projetos</a>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggle = document.querySelector('.theme-toggle');
            const themeMeta = document.querySelector('meta[name="theme-color"]');

            function current() {
                return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
            }

            function sync() {
                const theme = current();
                if (themeMeta) themeMeta.setAttribute('content', theme === 'light' ? '#f7f7f8' : '#050505');
                const icon = toggle.querySelector('i');
                icon.className = theme === 'light' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
                toggle.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
            }

            toggle.addEventListener('click', () => {
                const next = current() === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', next);
                try { localStorage.setItem('theme', next); } catch (e) { }
                sync();
            });

            sync();
        });
    </script>
</body>

</html>
